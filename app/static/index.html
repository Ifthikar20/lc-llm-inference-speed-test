<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local LLM · PDF → Questions</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .sub { opacity: .7; margin-top: 0; font-size: .9rem; }
    form {
      display: flex; flex-wrap: wrap; gap: .75rem; align-items: end;
      padding: 1rem; border: 1px solid #8884; border-radius: 10px; margin: 1rem 0;
    }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: .25rem; }
    input, button {
      font: inherit; padding: .5rem .6rem; border-radius: 8px;
      border: 1px solid #8886; background: transparent; color: inherit;
    }
    button {
      cursor: pointer; background: #2563eb; color: #fff; border: none; padding: .55rem 1.1rem;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-size: .9rem; min-height: 1.4em; }
    .card {
      border: 1px solid #8884; border-radius: 10px; padding: 1rem; margin: .85rem 0;
    }
    .q { font-weight: 600; margin-bottom: .6rem; }
    .opt {
      display: block; width: 100%; text-align: left; margin: .3rem 0; padding: .5rem .6rem;
      border: 1px solid #8886; border-radius: 8px; background: transparent; color: inherit;
      cursor: pointer;
    }
    .opt.correct { border-color: #16a34a; background: #16a34a22; }
    .opt.wrong { border-color: #dc2626; background: #dc262622; }
    .explain { margin-top: .6rem; font-size: .9rem; opacity: .85; }
    .stats { font-size: .8rem; opacity: .7; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>PDF → Exam Questions</h1>
  <p class="sub">Paste study material (or upload a PDF). It's sent to your local LLM and the response is converted into interactive questions.</p>

  <form id="textForm">
    <label style="flex:1 1 100%">Paste study material (~200 words works well)
      <textarea id="material" rows="7" placeholder="Paste a paragraph or two of study material here..." style="font:inherit;padding:.5rem .6rem;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit;resize:vertical"></textarea>
    </label>
    <label># Questions
      <input type="number" id="numText" value="5" min="1" max="20" style="width:6rem" />
    </label>
    <label>Difficulty
      <select id="diffText" style="font:inherit;padding:.5rem .6rem;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="exam">Exam-grade</option>
      </select>
    </label>
    <label>Model (optional)
      <input type="text" id="modelText" placeholder="llama3.1:8b" style="width:11rem" />
    </label>
    <button type="submit" id="goText">Generate from text</button>
  </form>

  <p class="sub" style="text-align:center;margin:.5rem 0">— or —</p>

  <form id="form">
    <label>PDF file
      <input type="file" id="file" accept="application/pdf" required />
    </label>
    <label># Questions
      <input type="number" id="num" value="5" min="1" max="20" style="width:6rem" />
    </label>
    <label>Difficulty
      <select id="diff" style="font:inherit;padding:.5rem .6rem;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="exam">Exam-grade</option>
      </select>
    </label>
    <label>Model (optional)
      <input type="text" id="model" placeholder="llama3.1:8b" style="width:11rem" />
    </label>
    <button type="submit" id="go">Generate from PDF</button>
  </form>

  <div id="status"></div>
  <details id="rawWrap" style="margin:.5rem 0" open>
    <summary style="cursor:pointer">Model output (raw, incl. &lt;think&gt;)</summary>
    <pre id="raw" style="white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;border:1px solid #8884;border-radius:8px;padding:.6rem;font-size:.85rem"></pre>
  </details>
  <div id="results"></div>

  <script>
    const form = document.getElementById("form");
    const textForm = document.getElementById("textForm");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");
    const go = document.getElementById("go");
    const goText = document.getElementById("goText");
    const rawEl = document.getElementById("raw");

    textForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const material = document.getElementById("material").value.trim();
      if (!material) { statusEl.textContent = "Paste some text first."; return; }
      const body = {
        material,
        num_questions: Number(document.getElementById("numText").value),
        difficulty: document.getElementById("diffText").value,
      };
      const model = document.getElementById("modelText").value.trim();
      if (model) body.model = model;

      goText.disabled = true;
      results.innerHTML = "";
      rawEl.textContent = "";
      statusEl.textContent = "Connecting to model…";

      try {
        const res = await fetch("/stream-questions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.detail || ("HTTP " + res.status));
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = "";
        const started = performance.now();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const piece = decoder.decode(value, { stream: true });
          full += piece;
          rawEl.textContent = full;
          rawEl.scrollTop = rawEl.scrollHeight;
          const secs = ((performance.now() - started) / 1000).toFixed(0);
          statusEl.textContent =
            `Receiving from model… ${full.length} chars in ${secs}s (it's working!)`;
        }
        if (full.includes("[ERROR]")) {
          statusEl.textContent = "Model error — see raw output above.";
          return;
        }
        const questions = parseQuestions(full);
        statusEl.textContent = questions.length
          ? `Done. ${questions.length} questions parsed.`
          : "Stream finished but no valid JSON questions were found — try llama3.1:8b or fewer questions.";
        questions.forEach((item, i) => results.appendChild(card(item, i)));
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        goText.disabled = false;
      }
    });

    function parseQuestions(text) {
      const s = text.indexOf("{");
      const e = text.lastIndexOf("}");
      if (s < 0 || e <= s) return [];
      try {
        const data = JSON.parse(text.slice(s, e + 1));
        return data.questions || [];
      } catch {
        return [];
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("file").files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append("file", file);
      fd.append("num_questions", document.getElementById("num").value);
      fd.append("difficulty", document.getElementById("diff").value);
      const model = document.getElementById("model").value.trim();
      if (model) fd.append("model", model);

      go.disabled = true;
      results.innerHTML = "";
      statusEl.textContent = "Extracting text and querying the model… (large PDFs + reasoning models can take a while)";

      try {
        const res = await fetch("/extract-from-pdf", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");
        render(data);
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        go.disabled = false;
      }
    });

    function render(data) {
      const q = data.questions || [];
      statusEl.textContent =
        `${q.length} questions from ${data.chars_extracted ?? "?"} chars.`;
      if (!q.length) {
        statusEl.textContent += " The model returned no parseable questions — try fewer questions or a different model.";
        return;
      }
      q.forEach((item, i) => results.appendChild(card(item, i)));
      const tps = (data.stats || [])
        .map(s => s.tokens_per_sec).filter(Boolean);
      if (tps.length) {
        const avg = (tps.reduce((a, b) => a + b, 0) / tps.length).toFixed(1);
        const div = document.createElement("div");
        div.className = "stats";
        div.textContent = `Avg local inference speed: ${avg} tokens/sec over ${tps.length} call(s).`;
        results.appendChild(div);
      }
    }

    function card(item, i) {
      const el = document.createElement("div");
      el.className = "card";
      const q = document.createElement("div");
      q.className = "q";
      q.textContent = `${i + 1}. ${item.question}`;
      el.appendChild(q);

      const correct = (item.answer || "").trim();
      (item.options || []).forEach((opt) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.type = "button";
        b.textContent = opt;
        b.addEventListener("click", () => {
          const letter = (opt.trim()[0] || "").toUpperCase();
          const isCorrect = letter === correct.toUpperCase()
            || opt.trim().toUpperCase().startsWith(correct.toUpperCase());
          b.classList.add(isCorrect ? "correct" : "wrong");
          if (!isCorrect) {
            [...el.querySelectorAll(".opt")].forEach(o => {
              const l = (o.textContent.trim()[0] || "").toUpperCase();
              if (l === correct.toUpperCase()) o.classList.add("correct");
            });
          }
          const ex = el.querySelector(".explain");
          if (ex) ex.style.display = "block";
        });
        el.appendChild(b);
      });

      if (item.explanation) {
        const ex = document.createElement("div");
        ex.className = "explain";
        ex.style.display = "none";
        ex.textContent = "Explanation: " + item.explanation;
        el.appendChild(ex);
      }
      return el;
    }
  </script>
</body>
</html>
